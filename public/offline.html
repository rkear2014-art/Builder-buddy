<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f0b429" />
    <title>Offline · Builder Buddy</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
        background: #f3efe4;
        color: #1c1915;
      }
      main {
        max-width: 28rem;
        margin: 0 auto;
        padding: 3rem 1.25rem;
      }
      .mark {
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 1.25rem;
        background: #f0b429;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 1.5rem;
      }
      h1 {
        font-size: 2.25rem;
        line-height: 1.1;
        margin: 1.25rem 0 0.75rem;
      }
      p {
        font-size: 1.125rem;
        line-height: 1.5;
        color: #655e55;
      }
      button {
        min-height: 3.25rem;
        padding: 0.7rem 1.1rem;
        border: 0;
        border-radius: 0.95rem;
        background: #f0b429;
        color: #1c1915;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">Bb</div>
      <h1>You're offline</h1>
      <p>Builder Buddy needs a connection to load your jobs. Customer details are not kept on this device.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
